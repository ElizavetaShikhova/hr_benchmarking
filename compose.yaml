services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hr_benchmarking
      POSTGRES_USER: hr
      POSTGRES_PASSWORD: hr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hr -d hr_benchmarking"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
